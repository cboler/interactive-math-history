<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" role="img" aria-label="Concrete mathematical diagram of Euclid's Common Notion of Equality: A equals B on an equal-arm balance scale">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#1c2333"/>
    </linearGradient>
    <linearGradient id="beamGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="diagGlow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad3)" stroke="#2b344a" stroke-width="2"/>

  <!-- Blueprint Coordinate Grid Lines -->
  <line x1="50" y1="210" x2="750" y2="210" stroke="#2a3348" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="400" y1="80" x2="400" y2="380" stroke="#2a3348" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Top Title Banner -->
  <text x="400" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="0.5">
    EUCLID'S AXIOM OF EQUALITY: THE BALANCE PRINCIPLE
  </text>
  <text x="400" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">
    "Things which equal the same thing also equal one another." — Elements, Book I, Common Notion 1
  </text>

  <!-- THE EQUAL-ARM BALANCE SCALE -->
  <g transform="translate(400, 195)">
    <!-- Stand Base & Pillar -->
    <rect x="-10" y="0" width="20" height="155" rx="5" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <polygon points="-70,165 70,165 45,150 -45,150" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

    <!-- Central Equilibrium Dial & Plumb Bob Indicator -->
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <!-- Degree markings on dial -->
    <line x1="-18" y1="-8" x2="-14" y2="-6" stroke="#64748b" stroke-width="1.5"/>
    <line x1="18" y1="-8" x2="14" y2="-6" stroke="#64748b" stroke-width="1.5"/>
    <!-- 0-Degree Vertical Equilibrium Line -->
    <line x1="0" y1="-22" x2="0" y2="22" stroke="#10b981" stroke-width="2.5" filter="url(#diagGlow3)"/>
    <circle cx="0" cy="0" r="6" fill="#fef08a" stroke="#d97706" stroke-width="1.5"/>

    <!-- Equilibrium State Badge directly below fulcrum -->
    <g transform="translate(0, 48)">
      <rect x="-70" y="0" width="140" height="26" rx="6" fill="#064e3b" fill-opacity="0.5" stroke="#10b981" stroke-width="1.2"/>
      <text x="0" y="17" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#34d399">
        0° EQUILIBRIUM
      </text>
    </g>

    <!-- The Horizontal Balance Beam (Zero Tilt: Deflection = 0) -->
    <line x1="-240" y1="0" x2="240" y2="0" stroke="url(#beamGold)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-240" cy="0" r="6" fill="#fef08a" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="240" cy="0" r="6" fill="#fef08a" stroke="#b45309" stroke-width="1.5"/>

    <!-- LEFT PAN (PAN A: 5 WEIGHTS) -->
    <g transform="translate(-240, 0)">
      <!-- Suspension Strings -->
      <line x1="0" y1="0" x2="-45" y2="90" stroke="#f59e0b" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="45" y2="90" stroke="#f59e0b" stroke-width="1.5"/>
      <!-- Pan A Basin -->
      <ellipse cx="0" cy="92" rx="55" ry="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <path d="M-55,92 Q0,118 55,92" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>

      <!-- 5 Cyan Geometric Precision Weights -->
      <g transform="translate(0, 72)">
        <rect x="-35" y="0" width="18" height="20" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
        <rect x="-12" y="0" width="18" height="20" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
        <rect x="11" y="0" width="18" height="20" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
        <!-- Stacked 2 weights on top -->
        <rect x="-24" y="-18" width="16" height="18" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
        <rect x="0" y="-18" width="16" height="18" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
      </g>

      <!-- Label Badge Pan A -->
      <rect x="-50" y="115" width="100" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="0" y="133" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">
        Pan A = 5
      </text>
    </g>

    <!-- RIGHT PAN (PAN B: 5 WEIGHTS) -->
    <g transform="translate(240, 0)">
      <!-- Suspension Strings -->
      <line x1="0" y1="0" x2="-45" y2="90" stroke="#f59e0b" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="45" y2="90" stroke="#f59e0b" stroke-width="1.5"/>
      <!-- Pan B Basin -->
      <ellipse cx="0" cy="92" rx="55" ry="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
      <path d="M-55,92 Q0,118 55,92" fill="#d97706" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>

      <!-- 5 Amber Geometric Precision Weights -->
      <g transform="translate(0, 72)">
        <rect x="-35" y="0" width="18" height="20" rx="3" fill="#f59e0b" stroke="#b45309" stroke-width="1.2"/>
        <rect x="-12" y="0" width="18" height="20" rx="3" fill="#f59e0b" stroke="#b45309" stroke-width="1.2"/>
        <rect x="11" y="0" width="18" height="20" rx="3" fill="#f59e0b" stroke="#b45309" stroke-width="1.2"/>
        <!-- Stacked 2 weights on top -->
        <rect x="-24" y="-18" width="16" height="18" rx="3" fill="#f59e0b" stroke="#b45309" stroke-width="1.2"/>
        <rect x="0" y="-18" width="16" height="18" rx="3" fill="#f59e0b" stroke="#b45309" stroke-width="1.2"/>
      </g>

      <!-- Label Badge Pan B -->
      <rect x="-50" y="115" width="100" height="28" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="0" y="133" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">
        Pan B = 5
      </text>
    </g>
  </g>

  <!-- EQUALITY THEOREM BANNER (Bottom Center) -->
  <g transform="translate(260, 390)">
    <rect width="280" height="42" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
    <text x="140" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#34d399">
      5 = 5  (EQUILIBRIUM ACHIEVED)
    </text>
  </g>

  <!-- AXIOM TRANSITIVITY BOX (Bottom Left) -->
  <g transform="translate(45, 335)">
    <rect width="220" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#93c5fd">TRANSITIVE AXIOM</text>
    <text x="14" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0">If Weight A = Scale B</text>
    <text x="14" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0">and Scale B = Weight C,</text>
    <text x="140" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399">then A = C.</text>
  </g>
</svg>
