<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" role="img" aria-label="Concrete mathematical diagram of bone tally addition: 3 notches plus 2 notches equals 5 notches in all on the Ishango bone">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#1c2333"/>
    </linearGradient>
    <linearGradient id="boneShaft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4332"/>
      <stop offset="30%" stop-color="#80624d"/>
      <stop offset="70%" stop-color="#6b513d"/>
      <stop offset="100%" stop-color="#3b291d"/>
    </linearGradient>
    <linearGradient id="quartzTip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#cde8f6"/>
      <stop offset="100%" stop-color="#8ac4df"/>
    </linearGradient>
    <filter id="diagramGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad1)" stroke="#2b344a" stroke-width="2"/>

  <!-- Subtle Blueprint / Grid Lines -->
  <line x1="50" y1="225" x2="750" y2="225" stroke="#2a3348" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="225" y1="90" x2="225" y2="360" stroke="#2a3348" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="475" y1="90" x2="475" y2="360" stroke="#2a3348" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Top Title Banner -->
  <text x="400" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="0.5">
    THE ISHANGO BONE TALLY: ADDITION AS CONTINUOUS NOTCHING
  </text>
  <text x="400" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">
    When new items are counted, more notches are cut forward along the bone.
  </text>

  <!-- THE ISHANGO BONE VECTOR RENDERING -->
  <g transform="translate(60, 180)">
    <!-- Bone Drop Shadow -->
    <rect x="0" y="16" width="680" height="70" rx="28" fill="#000000" opacity="0.4"/>

    <!-- Quartz Crystal Tip (Left end) -->
    <polygon points="12,18 -18,44 12,70" fill="url(#quartzTip)" filter="url(#diagramGlow)"/>
    <polygon points="12,18 2,44 12,70" fill="#e2f2fa"/>
    <!-- Sinew wrapping -->
    <rect x="10" y="14" width="22" height="60" rx="6" fill="#2d1f16" stroke="#4a3525" stroke-width="1.5"/>

    <!-- Main Bone Body -->
    <rect x="28" y="10" width="640" height="68" rx="26" fill="url(#boneShaft)"/>
    <!-- Bone Natural Texture Highlights -->
    <path d="M40,24 Q360,18 640,24" stroke="#a07d64" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M40,68 Q360,72 640,68" stroke="#2b1c13" stroke-width="3" fill="none" opacity="0.7"/>

    <!-- GROUP A: 3 Carved Notches (Cyan / Blue) -->
    <g transform="translate(130, 0)">
      <!-- Highlight box for Group A -->
      <rect x="-18" y="-12" width="126" height="112" rx="12" fill="#0284c7" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4"/>

      <!-- 3 Carved Notches -->
      <line x1="15" y1="20" x2="15" y2="68" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#diagramGlow)"/>
      <line x1="45" y1="20" x2="45" y2="68" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#diagramGlow)"/>
      <line x1="75" y1="20" x2="75" y2="68" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#diagramGlow)"/>

      <!-- Inner groove shadow -->
      <line x1="16" y1="22" x2="16" y2="66" stroke="#082f49" stroke-width="2" stroke-linecap="round"/>
      <line x1="46" y1="22" x2="46" y2="66" stroke="#082f49" stroke-width="2" stroke-linecap="round"/>
      <line x1="76" y1="22" x2="76" y2="66" stroke="#082f49" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- PLUS SIGN OPERATOR -->
    <g transform="translate(290, 44)">
      <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
      <path d="M-10,0 L10,0 M0,-10 L0,10" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- GROUP B: 2 Carved Notches (Amber / Gold) -->
    <g transform="translate(360, 0)">
      <!-- Highlight box for Group B -->
      <rect x="-18" y="-12" width="96" height="112" rx="12" fill="#d97706" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,4"/>

      <!-- 2 Carved Notches -->
      <line x1="15" y1="20" x2="15" y2="68" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" filter="url(#diagramGlow)"/>
      <line x1="45" y1="20" x2="45" y2="68" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" filter="url(#diagramGlow)"/>

      <!-- Inner groove shadow -->
      <line x1="16" y1="22" x2="16" y2="66" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>
      <line x1="46" y1="22" x2="46" y2="66" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- EQUALS OPERATOR -->
    <g transform="translate(490, 44)">
      <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
      <path d="M-10,-5 L10,-5 M-10,5 L10,5" stroke="#10b981" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- RESULT SUMMARY BADGE -->
    <g transform="translate(540, 10)">
      <rect x="0" y="0" width="115" height="68" rx="12" fill="#064e3b" fill-opacity="0.3" stroke="#34d399" stroke-width="2"/>
      <text x="57" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">IN ALL</text>
      <text x="57" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff">5 Notches</text>
    </g>
  </g>

  <!-- Labels & Explanatory Brackets (Top) -->
  <!-- Bracket A -->
  <path d="M190,158 L190,145 Q190,135 235,135 L235,135 Q245,135 245,125 Q245,135 255,135 L280,135 Q300,135 300,145 L300,158" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="245" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">
    3 Notches Carved (A)
  </text>

  <!-- Bracket B -->
  <path d="M420,158 L420,145 Q420,135 445,135 L445,135 Q455,135 455,125 Q455,135 465,135 L480,135 Q500,135 500,145 L500,158" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <text x="460" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">
    2 Notches Added (B)
  </text>

  <!-- Total Inclusive Span (Bottom) -->
  <g transform="translate(180, 310)">
    <path d="M10,10 L10,25 Q10,35 155,35 L155,35 Q165,35 165,45 Q165,35 175,35 L310,35 Q320,35 320,25 L320,10" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <rect x="70" y="55" width="190" height="36" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="165" y="79" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#34d399">
      3 + 2 = 5 TOTAL
    </text>
  </g>

  <!-- Pedagogical Takeaway Box at bottom right -->
  <g transform="translate(540, 320)">
    <rect width="210" height="96" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="14" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="0.5">THE TALLY PRINCIPLE</text>
    <text x="14" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">Counts are permanent.</text>
    <text x="14" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">To add, we step forward</text>
    <text x="14" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">and carve the next notches.</text>
  </g>
</svg>
