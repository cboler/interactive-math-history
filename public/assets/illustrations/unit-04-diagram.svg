<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" role="img" aria-label="Concrete mathematical diagram of commutativity: 3 times 5 equals 5 times 3 equals 15 dots under 90-degree planar rotation">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#1c2333"/>
    </linearGradient>
    <filter id="gridGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad4)" stroke="#2b344a" stroke-width="2"/>

  <!-- Blueprint Coordinate Grid Lines -->
  <line x1="50" y1="210" x2="750" y2="210" stroke="#2a3348" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="400" y1="70" x2="400" y2="370" stroke="#2a3348" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Top Title Banner -->
  <text x="400" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="0.5">
    SPATIAL INVARIANCE: MULTIPLICATION AS PLANAR AREA
  </text>
  <text x="400" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">
    Turning a field by 90° transforms rows into columns, but every single plant is conserved.
  </text>

  <!-- LEFT PANEL: 3 ROWS × 5 COLUMNS -->
  <g transform="translate(100, 110)">
    <!-- Container Box -->
    <rect x="0" y="0" width="240" height="190" rx="12" fill="#022c22" fill-opacity="0.3" stroke="#10b981" stroke-width="1.8"/>

    <text x="120" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#34d399">
      3 Rows × 5 Columns
    </text>

    <!-- 3 × 5 Dot Grid -->
    <g transform="translate(30, 45)">
      <!-- Row 1 -->
      <circle cx="15" cy="20" r="10" fill="#10b981" filter="url(#gridGlow)"/>
      <circle cx="55" cy="20" r="10" fill="#10b981" filter="url(#gridGlow)"/>
      <circle cx="95" cy="20" r="10" fill="#10b981" filter="url(#gridGlow)"/>
      <circle cx="135" cy="20" r="10" fill="#10b981" filter="url(#gridGlow)"/>
      <circle cx="175" cy="20" r="10" fill="#10b981" filter="url(#gridGlow)"/>

      <!-- Row 2 -->
      <circle cx="15" cy="60" r="10" fill="#10b981" filter="url(#gridGlow)"/>
      <circle cx="55" cy="60" r="10" fill="#10b981" filter="url(#gridGlow)"/>
      <circle cx="95" cy="60" r="10" fill="#10b981" filter="url(#gridGlow)"/>
      <circle cx="135" cy="60" r="10" fill="#10b981" filter="url(#gridGlow)"/>
      <circle cx="175" cy="60" r="10" fill="#10b981" filter="url(#gridGlow)"/>

      <!-- Row 3 -->
      <circle cx="15" cy="100" r="10" fill="#10b981" filter="url(#gridGlow)"/>
      <circle cx="55" cy="100" r="10" fill="#10b981" filter="url(#gridGlow)"/>
      <circle cx="95" cy="100" r="10" fill="#10b981" filter="url(#gridGlow)"/>
      <circle cx="135" cy="100" r="10" fill="#10b981" filter="url(#gridGlow)"/>
      <circle cx="175" cy="100" r="10" fill="#10b981" filter="url(#gridGlow)"/>
    </g>

    <!-- Subtotal Badge -->
    <rect x="55" y="152" width="130" height="26" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.2"/>
    <text x="120" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">
      Area = 15 Dots
    </text>
  </g>

  <!-- CENTER: ROTATE 90° TRANSFORMATION ARROW -->
  <g transform="translate(400, 205)">
    <circle cx="0" cy="0" r="32" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <!-- Circular Arrow -->
    <path d="M-14,-8 A16,16 0 1,1 14,-8" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <polygon points="12,-16 20,-6 10,-4" fill="#f59e0b"/>
    <text x="0" y="4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#fbbf24">
      90°
    </text>
    <text x="0" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">
      TRANSPOSE
    </text>
  </g>

  <!-- RIGHT PANEL: 5 ROWS × 3 COLUMNS -->
  <g transform="translate(460, 110)">
    <!-- Container Box -->
    <rect x="0" y="0" width="240" height="190" rx="12" fill="#082f49" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.8"/>

    <text x="120" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#38bdf8">
      5 Rows × 3 Columns
    </text>

    <!-- 5 × 3 Dot Grid -->
    <g transform="translate(60, 42)">
      <!-- Row 1 -->
      <circle cx="15" cy="14" r="8.5" fill="#38bdf8" filter="url(#gridGlow)"/>
      <circle cx="60" cy="14" r="8.5" fill="#38bdf8" filter="url(#gridGlow)"/>
      <circle cx="105" cy="14" r="8.5" fill="#38bdf8" filter="url(#gridGlow)"/>

      <!-- Row 2 -->
      <circle cx="15" cy="38" r="8.5" fill="#38bdf8" filter="url(#gridGlow)"/>
      <circle cx="60" cy="38" r="8.5" fill="#38bdf8" filter="url(#gridGlow)"/>
      <circle cx="105" cy="38" r="8.5" fill="#38bdf8" filter="url(#gridGlow)"/>

      <!-- Row 3 -->
      <circle cx="15" cy="62" r="8.5" fill="#38bdf8" filter="url(#gridGlow)"/>
      <circle cx="60" cy="62" r="8.5" fill="#38bdf8" filter="url(#gridGlow)"/>
      <circle cx="105" cy="62" r="8.5" fill="#38bdf8" filter="url(#gridGlow)"/>

      <!-- Row 4 -->
      <circle cx="15" cy="86" r="8.5" fill="#38bdf8" filter="url(#gridGlow)"/>
      <circle cx="60" cy="86" r="8.5" fill="#38bdf8" filter="url(#gridGlow)"/>
      <circle cx="105" cy="86" r="8.5" fill="#38bdf8" filter="url(#gridGlow)"/>

      <!-- Row 5 -->
      <circle cx="15" cy="110" r="8.5" fill="#38bdf8" filter="url(#gridGlow)"/>
      <circle cx="60" cy="110" r="8.5" fill="#38bdf8" filter="url(#gridGlow)"/>
      <circle cx="105" cy="110" r="8.5" fill="#38bdf8" filter="url(#gridGlow)"/>
    </g>

    <!-- Subtotal Badge -->
    <rect x="55" y="152" width="130" height="26" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="120" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#7dd3fc">
      Area = 15 Dots
    </text>
  </g>

  <!-- BOTTOM COMMUTATIVE LAW EQUATION BANNER -->
  <g transform="translate(230, 365)">
    <rect width="340" height="52" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="170" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#34d399">
      3 × 5 = 5 × 3 = 15
    </text>
  </g>
</svg>
