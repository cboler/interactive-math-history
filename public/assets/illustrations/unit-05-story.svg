<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" role="img" aria-label="Sumerian scribes measuring equal grain rations into woven reed baskets at the Shuruppak city gate under a desert sunrise">
  <defs>
    <linearGradient id="sumerSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="35%" stop-color="#312e81"/>
      <stop offset="65%" stop-color="#b45309"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="mudbrickWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="reedBasket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="goldenGrain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="cityGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Mesopotamian Dawn Sky -->
  <rect width="800" height="450" fill="url(#sumerSky)"/>

  <!-- Glowing Morning Sun Rising over the Euphrates Plain -->
  <circle cx="400" cy="220" r="80" fill="#fef08a" opacity="0.45" filter="url(#cityGlow)"/>
  <circle cx="400" cy="220" r="50" fill="#fef9c3" opacity="0.8"/>

  <!-- Distant Ziggurat & City Walls of Shuruppak -->
  <path d="M0,250 L120,235 L180,245 L250,220 L310,220 L310,195 L340,195 L340,175 L360,175 L360,160 L380,160 L380,175 L400,175 L400,195 L430,195 L430,220 L520,230 L640,215 L720,235 L800,225 L800,320 L0,320 Z" fill="#291305" opacity="0.75"/>

  <!-- City Ramparts & Massive Mud-brick Archway -->
  <path d="M0,320 L280,310 L280,180 L350,150 L520,150 L590,180 L590,310 L800,310 L800,450 L0,450 Z" fill="url(#mudbrickWall)"/>
  <!-- Arch Gate Silhouette -->
  <path d="M360,330 L360,240 Q435,190 510,240 L510,330 Z" fill="#1c0e04"/>

  <!-- Stone Flagstone Ground at City Gate -->
  <path d="M0,330 L800,330 L800,450 L0,450 Z" fill="#2d1a0e"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#452410" stroke-width="2"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#452410" stroke-width="2"/>

  <!-- Central Low Wooden Measuring Table -->
  <rect x="180" y="345" width="440" height="24" rx="4" fill="#5c2c0e" stroke="#78350f" stroke-width="2"/>
  <rect x="210" y="369" width="22" height="60" rx="3" fill="#3f1e09"/>
  <rect x="568" y="369" width="22" height="60" rx="3" fill="#3f1e09"/>

  <!-- Three Equal Woven Baskets on the Distribution Table -->
  <!-- Basket 1 -->
  <g transform="translate(220, 305)">
    <ellipse cx="40" cy="45" rx="38" ry="18" fill="url(#reedBasket)" stroke="#78350f" stroke-width="2"/>
    <ellipse cx="40" cy="30" rx="36" ry="16" fill="url(#goldenGrain)"/>
    <path d="M4,30 Q40,55 76,30 L68,52 Q40,68 12,52 Z" fill="#a16207" opacity="0.6"/>
    <!-- Grain measures inside -->
    <circle cx="28" cy="27" r="7" fill="#fef08a"/>
    <circle cx="42" cy="24" r="7" fill="#fef08a"/>
    <circle cx="53" cy="28" r="7" fill="#fef08a"/>
    <circle cx="38" cy="33" r="7" fill="#fde047"/>
  </g>

  <!-- Basket 2 -->
  <g transform="translate(360, 305)">
    <ellipse cx="40" cy="45" rx="38" ry="18" fill="url(#reedBasket)" stroke="#78350f" stroke-width="2"/>
    <ellipse cx="40" cy="30" rx="36" ry="16" fill="url(#goldenGrain)"/>
    <path d="M4,30 Q40,55 76,30 L68,52 Q40,68 12,52 Z" fill="#a16207" opacity="0.6"/>
    <circle cx="28" cy="27" r="7" fill="#fef08a"/>
    <circle cx="42" cy="24" r="7" fill="#fef08a"/>
    <circle cx="53" cy="28" r="7" fill="#fef08a"/>
    <circle cx="38" cy="33" r="7" fill="#fde047"/>
  </g>

  <!-- Basket 3 -->
  <g transform="translate(500, 305)">
    <ellipse cx="40" cy="45" rx="38" ry="18" fill="url(#reedBasket)" stroke="#78350f" stroke-width="2"/>
    <ellipse cx="40" cy="30" rx="36" ry="16" fill="url(#goldenGrain)"/>
    <path d="M4,30 Q40,55 76,30 L68,52 Q40,68 12,52 Z" fill="#a16207" opacity="0.6"/>
    <circle cx="28" cy="27" r="7" fill="#fef08a"/>
    <circle cx="42" cy="24" r="7" fill="#fef08a"/>
    <circle cx="53" cy="28" r="7" fill="#fef08a"/>
    <circle cx="38" cy="33" r="7" fill="#fde047"/>
  </g>

  <!-- Scribe's Clay Tablet & Reed Stylus on Left Stand -->
  <g transform="translate(90, 320)">
    <rect x="0" y="0" width="65" height="50" rx="8" fill="#d4b483" stroke="#a68052" stroke-width="2" transform="rotate(-10)"/>
    <!-- Cuneiform wedge marks -->
    <path d="M12,14 L18,14 L15,20 Z M22,12 L28,12 L25,18 Z M14,24 L22,24 L18,30 Z M26,22 L34,22 L30,28 Z" fill="#634825" transform="rotate(-10)"/>
    <!-- Reed Stylus -->
    <rect x="42" y="10" width="5" height="42" rx="2" fill="#eab308" transform="rotate(35)"/>
  </g>

  <!-- Scribe Figure Silhouette (Gesturing with fair measuring bowl) -->
  <g transform="translate(680, 260)">
    <!-- Body & Shawl -->
    <path d="M35,60 Q50,75 55,160 L10,160 Q15,85 25,60 Z" fill="#1b0e06"/>
    <!-- Head -->
    <circle cx="35" cy="35" r="16" fill="#1b0e06"/>
    <!-- Extended Arm holding Bronze Grain Balance -->
    <path d="M25,65 Q0,75 -25,85" stroke="#1b0e06" stroke-width="8" stroke-linecap="round" fill="none"/>
    <ellipse cx="-30" cy="88" rx="14" ry="7" fill="#ca8a04"/>
  </g>
</svg>
