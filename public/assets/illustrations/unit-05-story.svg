<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" role="img" aria-label="Royal scribe Ahmes seated beside the Nile with the Rhind Papyrus and a bronze blade, slicing bread loaves into unit fraction shares for temple stone-cutters">
  <defs>
    <linearGradient id="egyptSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="35%" stop-color="#1e3a8a"/>
      <stop offset="65%" stop-color="#b45309"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="nileRiver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="papyrusRoll" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="egyptGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Egyptian Golden Sky -->
  <rect width="800" height="450" fill="url(#egyptSky)"/>

  <!-- Distant Theban Cliffs & Karnak Pylons across the Nile -->
  <path d="M0,260 L80,240 L160,250 L280,225 L380,245 L480,215 L590,250 L720,230 L800,245 L800,320 L0,320 Z" fill="#451a03" opacity="0.6"/>
  <!-- Karnak Temple Pylon Silhouette -->
  <g transform="translate(620, 210)" opacity="0.5">
    <polygon points="10,40 18,10 42,10 46,40" fill="#2d1305"/>
    <polygon points="56,40 60,10 84,10 92,40" fill="#2d1305"/>
    <rect x="42" y="22" width="14" height="18" fill="#1b0a02"/>
  </g>

  <!-- The Nile River -->
  <rect x="0" y="280" width="800" height="170" fill="url(#nileRiver)"/>
  <!-- Water sun ripples -->
  <ellipse cx="400" cy="295" rx="70" ry="3" fill="#fde68a" opacity="0.7"/>
  <ellipse cx="400" cy="308" rx="55" ry="2.5" fill="#fde68a" opacity="0.5"/>
  <ellipse cx="400" cy="324" rx="40" ry="2" fill="#f59e0b" opacity="0.4"/>

  <!-- Riverbank Silt and Reeds -->
  <path d="M0,450 L0,330 Q240,340 480,360 Q660,375 800,350 L800,450 Z" fill="#1c120c"/>
  <path d="M0,450 L0,350 Q200,360 400,380 Q600,400 800,380 L800,450 Z" fill="#2b1a0e"/>

  <!-- Woven Reed Mat (Where Scribe Ahmes sits) -->
  <ellipse cx="320" cy="405" rx="160" ry="35" fill="#78350f" stroke="#a16207" stroke-width="2"/>
  <ellipse cx="320" cy="405" rx="140" ry="28" fill="#92400e" opacity="0.7"/>

  <!-- Round Emmer-Wheat Bread Loaves on the Mat -->
  <g transform="translate(180, 370)">
    <!-- Loaf 1 -->
    <ellipse cx="25" cy="20" rx="24" ry="14" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>
    <ellipse cx="25" cy="18" rx="18" ry="10" fill="#f59e0b"/>
    <!-- Loaf 2 -->
    <ellipse cx="65" cy="25" rx="24" ry="14" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>
    <ellipse cx="65" cy="23" rx="18" ry="10" fill="#f59e0b"/>
    <!-- Loaf 3 (Being sliced into half & tenths!) -->
    <ellipse cx="110" cy="18" rx="24" ry="14" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>
    <ellipse cx="110" cy="16" rx="18" ry="10" fill="#f59e0b"/>
    <!-- Cut slice mark -->
    <line x1="110" y1="6" x2="110" y2="28" stroke="#451a03" stroke-width="2"/>
  </g>

  <!-- SCRIBE AHMES (Seated cross-legged, holding bronze knife & papyrus) -->
  <g transform="translate(320, 240)">
    <!-- Torso & White Linen Kilt -->
    <path d="M20,160 C15,110 35,75 70,65 C105,55 130,75 135,115 C130,140 140,155 150,160 Z" fill="#1c120c"/>
    <!-- Head with Egyptian shaved head / black wig -->
    <ellipse cx="78" cy="42" rx="17" ry="22" fill="#1c120c"/>
    <!-- Warm golden sunlight rim on shoulder -->
    <path d="M55,68 Q78,60 102,70 Q118,90 115,120" stroke="#f59e0b" stroke-width="2.5" fill="none" opacity="0.8"/>

    <!-- Left Arm resting on knee, holding the Rhind Papyrus Roll -->
    <path d="M45,95 Q20,125 0,130" stroke="#1c120c" stroke-width="15" fill="none" stroke-linecap="round"/>

    <!-- The Rhind Papyrus Roll (Open across lap) -->
    <g transform="translate(-40, 115) rotate(-10)">
      <rect x="0" y="0" width="80" height="28" rx="3" fill="url(#papyrusRoll)" stroke="#78350f" stroke-width="1.5"/>
      <!-- Hieratic characters / fractions tables -->
      <line x1="10" y1="8" x2="25" y2="8" stroke="#78350f" stroke-width="1.5"/>
      <line x1="10" y1="14" x2="35" y2="14" stroke="#78350f" stroke-width="1.5"/>
      <!-- The Hieroglyph for fraction "r" (mouth sign) -->
      <ellipse cx="55" cy="12" rx="8" ry="4" fill="none" stroke="#b45309" stroke-width="1.5"/>
      <line x1="55" y1="18" x2="55" y2="24" stroke="#b45309" stroke-width="1.5"/>
    </g>

    <!-- Right Arm holding the curved Bronze Baker's Knife -->
    <path d="M100,95 Q115,120 90,145" stroke="#1c120c" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- Bronze Blade slicing the loaf -->
    <path d="M90,140 Q105,145 100,165" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Temple Stone-Cutters (Right, awaiting their fair portions) -->
  <g transform="translate(600, 240)">
    <!-- Worker 1 -->
    <path d="M10,180 C20,120 40,90 65,80 C90,70 105,85 110,115 C105,140 115,160 120,180 Z" fill="#1c120c"/>
    <ellipse cx="68" cy="48" rx="16" ry="20" fill="#1c120c"/>
    <!-- Hands holding woven worker's basket -->
    <ellipse cx="15" cy="150" rx="26" ry="10" fill="#78350f" stroke="#a16207" stroke-width="1.2"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 360)">
    <rect width="285" height="54" rx="8" fill="#100d18" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="16" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" letter-spacing="1">THEBES, ANCIENT EGYPT · c. 1550 BCE</text>
    <text x="16" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#f3e8ff">Ahmes &amp; The Rhind Papyrus: 3/5 = 1/2 + 1/10</text>
  </g>
</svg>
