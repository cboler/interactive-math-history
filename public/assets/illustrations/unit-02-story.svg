<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" role="img" aria-label="Paleolithic foragers seated around a glowing campfire in a rock shelter, consulting a notched tally bone as they distribute shared provisions">
  <defs>
    <linearGradient id="caveBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0a14"/>
      <stop offset="40%" stop-color="#191424"/>
      <stop offset="80%" stop-color="#2d1c24"/>
      <stop offset="100%" stop-color="#120c18"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx="50%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#ffeed1" stop-opacity="1"/>
      <stop offset="25%" stop-color="#fca311" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#d9381e" stop-opacity="0.45"/>
      <stop offset="85%" stop-color="#541212" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tallyBone" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#543d2b"/>
      <stop offset="50%" stop-color="#7c5f46"/>
      <stop offset="100%" stop-color="#3b291c"/>
    </linearGradient>
    <filter id="fireBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rock Shelter Cave Background -->
  <rect width="800" height="450" fill="url(#caveBg)"/>

  <!-- Rock Shelter Arch & Overhang -->
  <path d="M0,0 L800,0 L800,160 Q650,110 500,130 Q350,90 200,120 Q80,100 0,150 Z" fill="#08060d"/>
  <path d="M0,0 L0,450 L120,450 Q90,320 150,220 Q110,140 0,100 Z" fill="#0c0914"/>
  <path d="M800,0 L800,450 L700,450 Q730,300 680,210 Q740,120 800,90 Z" fill="#0c0914"/>

  <!-- Distant Starlit Night Outside the Cave Mouth -->
  <g opacity="0.7">
    <circle cx="280" cy="70" r="1.5" fill="#ffffff"/>
    <circle cx="340" cy="50" r="1.2" fill="#ffffff"/>
    <circle cx="420" cy="65" r="1.5" fill="#fde047"/>
    <circle cx="490" cy="45" r="1.2" fill="#ffffff"/>
    <circle cx="560" cy="80" r="1.5" fill="#ffffff"/>
    <!-- Crescent Moon -->
    <path d="M380,45 A12,12 0 0 0 392,57 A9,9 0 0 1 380,45 Z" fill="#fef08a"/>
  </g>

  <!-- Campfire Ambient Glow -->
  <rect x="150" y="150" width="500" height="300" fill="url(#fireGlow)"/>

  <!-- Campfire Base Stones & Embers -->
  <ellipse cx="400" cy="385" rx="60" ry="18" fill="#140a08"/>
  <circle cx="380" cy="382" r="14" fill="#2b140d"/>
  <circle cx="420" cy="384" r="16" fill="#2b140d"/>
  <circle cx="400" cy="388" r="13" fill="#38190e"/>

  <!-- Campfire Flames -->
  <g filter="url(#fireBlur)">
    <path d="M380,380 Q395,300 400,280 Q405,300 420,380 Z" fill="#ffedd5"/>
    <path d="M370,385 Q390,310 395,295 Q405,330 425,385 Z" fill="#fbbf24"/>
    <path d="M360,385 Q385,320 400,310 Q415,340 435,385 Z" fill="#ea580c"/>
    <path d="M350,388 Q375,340 400,335 Q425,350 445,388 Z" fill="#991b1b" opacity="0.6"/>
  </g>

  <!-- Seated Figures Sharing Provisions (Silhouettes rim-lit by fire) -->
  <!-- Figure Left (Elder/Keeper of the Tally) -->
  <g transform="translate(190, 240)">
    <!-- Body -->
    <path d="M50,180 C40,120 70,80 110,65 C140,55 170,70 180,95 C170,125 180,150 195,180 Z" fill="#17101e"/>
    <!-- Head leaning forward to inspect bone -->
    <ellipse cx="145" cy="40" rx="18" ry="22" fill="#17101e"/>
    <!-- Warm rim light on back and shoulder -->
    <path d="M120,60 Q145,55 170,70 Q180,90 178,120" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.8"/>

    <!-- Left Arm extending the Notched Tally Bone toward the firelight -->
    <path d="M130,95 Q170,120 210,125" stroke="#17101e" stroke-width="18" fill="none" stroke-linecap="round"/>

    <!-- The Notched Tally Bone (Held out in the warm firelight) -->
    <g transform="translate(205, 115) rotate(15)">
      <rect x="0" y="0" width="130" height="15" rx="6" fill="url(#tallyBone)"/>
      <path d="M5,3 Q65,1 125,4" stroke="#a07d64" stroke-width="1.2" fill="none"/>
      <!-- Carved notches visible on bone -->
      <line x1="20" y1="2" x2="20" y2="13" stroke="#fef08a" stroke-width="2"/>
      <line x1="30" y1="2" x2="30" y2="13" stroke="#fef08a" stroke-width="2"/>
      <line x1="40" y1="2" x2="40" y2="13" stroke="#fef08a" stroke-width="2"/>
      <line x1="50" y1="2" x2="50" y2="13" stroke="#fef08a" stroke-width="2"/>
      <!-- Crossed off / accounted for notches -->
      <line x1="68" y1="2" x2="68" y2="13" stroke="#ef4444" stroke-width="2.2"/>
      <line x1="78" y1="2" x2="78" y2="13" stroke="#ef4444" stroke-width="2.2"/>
      <line x1="88" y1="2" x2="88" y2="13" stroke="#ef4444" stroke-width="2.2"/>
    </g>
  </g>

  <!-- Figure Right (Family member receiving shared smoked rations) -->
  <g transform="translate(480, 250)">
    <!-- Body -->
    <path d="M20,170 C40,110 70,80 100,70 C130,60 150,80 160,110 C150,135 155,155 170,170 Z" fill="#17101e"/>
    <!-- Head -->
    <ellipse cx="90" cy="45" rx="17" ry="20" fill="#17101e"/>
    <!-- Firelight edge highlight -->
    <path d="M60,65 Q85,60 110,70" stroke="#f59e0b" stroke-width="2.5" fill="none" opacity="0.7"/>
    <!-- Arms reaching out to receive shared bundles -->
    <path d="M70,95 Q40,125 -10,130" stroke="#17101e" stroke-width="16" fill="none" stroke-linecap="round"/>

    <!-- Woven basket with shared dried provisions / fish rations -->
    <ellipse cx="-20" cy="140" rx="30" ry="14" fill="#3b2518" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M-45,140 Q-20,165 5,140" fill="#29180d"/>
  </g>

  <!-- Historical Era Badge -->
  <g transform="translate(40, 360)">
    <rect width="270" height="54" rx="8" fill="#100d18" fill-opacity="0.9" stroke="#ea580c" stroke-width="1.5"/>
    <text x="16" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fb923c" letter-spacing="1">THE LEBOMBO BONE · c. 40,000 BCE</text>
    <text x="16" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#f3e8ff">Tracking provisions, sharing, and taking away</text>
  </g>
</svg>
