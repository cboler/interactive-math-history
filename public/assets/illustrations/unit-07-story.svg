<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" role="img" aria-label="Aristotle strolling through the shaded marble colonnade of the Lyceum in Athens at dusk, gesturing toward an illuminated oil lamp to demonstrate the flow of deductive logic">
  <defs>
    <linearGradient id="athensSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="35%" stop-color="#1e1b4b"/>
      <stop offset="65%" stop-color="#431407"/>
      <stop offset="85%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="lampLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="lampGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Twilight Athenian Sky -->
  <rect width="800" height="450" fill="url(#athensSky)"/>

  <!-- Distant Acropolis and Olive Groves on the Athenian Horizon -->
  <path d="M0,280 L120,265 L220,250 L340,230 L450,235 L520,255 L650,240 L800,260 L800,340 L0,340 Z" fill="#1e142b" opacity="0.6"/>
  <!-- Parthenon Temple Profile on the distant hill -->
  <g transform="translate(340, 215)" opacity="0.45">
    <rect x="0" y="8" width="65" height="4" fill="#2d1c3e"/>
    <rect x="2" y="12" width="61" height="12" fill="#241633"/>
    <polygon points="32,2 0,8 65,8" fill="#38224d"/>
  </g>

  <!-- Marble Colonnade (Peripatos of the Lyceum) -->
  <!-- Roof Beams & Entablature -->
  <rect x="0" y="20" width="800" height="30" fill="#1b1226" stroke="#37254d" stroke-width="1.5"/>
  <rect x="0" y="50" width="800" height="12" fill="#130c1c"/>

  <!-- Fluted Classical Doric Columns -->
  <!-- Column 1 (Far Left) -->
  <rect x="30" y="50" width="55" height="400" fill="#271c36"/>
  <rect x="22" y="50" width="71" height="12" rx="2" fill="#3a2b4f"/>
  <!-- Column 2 -->
  <rect x="220" y="50" width="50" height="400" fill="#21172f"/>
  <rect x="214" y="50" width="62" height="12" rx="2" fill="#322444"/>
  <!-- Column 3 -->
  <rect x="410" y="50" width="48" height="400" fill="#1c1328"/>
  <!-- Column 4 (Right) -->
  <rect x="680" y="50" width="52" height="400" fill="#271c36"/>

  <!-- Colonnade Paved Terrace Floor -->
  <path d="M0,350 L800,350 L800,450 L0,450 Z" fill="#120a1c"/>
  <line x1="0" y1="390" x2="800" y2="390" stroke="#251638" stroke-width="1.5"/>

  <!-- THE BRONZE ATHENIAN OIL LAMP (Mounted on Marble Pedestal) -->
  <g transform="translate(480, 210)">
    <!-- Pedestal -->
    <rect x="-16" y="70" width="32" height="85" rx="4" fill="#261b36" stroke="#432f5e" stroke-width="1.2"/>
    <rect x="-24" y="65" width="48" height="8" rx="2" fill="#36264d"/>

    <!-- Bronze Lamp Basin & Spout -->
    <ellipse cx="0" cy="62" rx="20" ry="7" fill="#78350f" stroke="#d97706" stroke-width="1.5"/>
    <path d="M12,62 Q28,58 32,50 Q28,46 16,58 Z" fill="#92400e"/>

    <!-- Glowing Flame & Radius of Deductive Illumination -->
    <circle cx="30" cy="48" r="45" fill="url(#lampLight)" opacity="0.6"/>
    <ellipse cx="30" cy="48" rx="7" ry="12" fill="#fef08a" filter="url(#lampGlow)"/>
    <ellipse cx="30" cy="46" rx="4" ry="7" fill="#ffffff"/>
  </g>

  <!-- ARISTOTLE (Walking with disciple, gesturing toward the lamp) -->
  <g transform="translate(290, 215)">
    <!-- Toga / Himation draped gracefully -->
    <path d="M30,190 C25,125 50,85 85,75 C120,65 145,85 150,125 C145,155 155,175 165,190 Z" fill="#150e21"/>
    <!-- Head with bearded philosopher profile -->
    <ellipse cx="90" cy="45" rx="17" ry="22" fill="#150e21"/>
    <!-- Beard & curly hair silhouette -->
    <path d="M78,50 Q85,72 102,68" stroke="#150e21" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- Lamplight rim highlight on face and draped himation -->
    <path d="M85,75 Q115,70 135,85 Q148,110 145,145" stroke="#f59e0b" stroke-width="2.8" fill="none" opacity="0.8"/>

    <!-- Right Arm extended toward the lamp in logical demonstration -->
    <path d="M110,100 Q145,110 180,105" stroke="#150e21" stroke-width="14" fill="none" stroke-linecap="round"/>
    <line x1="180" y1="105" x2="195" y2="102" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Lyceum Disciple / Student (Listening attentively) -->
  <g transform="translate(190, 235)">
    <path d="M20,180 C25,130 45,95 70,85 C95,75 110,95 115,130 C110,155 120,170 130,180 Z" fill="#150e21"/>
    <ellipse cx="72" cy="52" rx="15" ry="18" fill="#150e21"/>
    <!-- Holding papyrus note scroll -->
    <path d="M60,115 Q40,135 25,130" stroke="#150e21" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 360)">
    <rect width="280" height="54" rx="8" fill="#100d18" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="16" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" letter-spacing="1">ATHENIAN LYCEUM · c. 350 BCE</text>
    <text x="16" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#f3e8ff">Aristotle &amp; The Flow of Syllogistic Logic</text>
  </g>
</svg>
