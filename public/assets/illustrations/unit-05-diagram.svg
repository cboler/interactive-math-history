<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" role="img" aria-label="Concrete mathematical diagram of division: 12 golden melons distributed equally across 3 baskets leaving 4 melons per basket">
  <defs>
    <linearGradient id="diagBg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="melonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="melonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="450" rx="16" fill="url(#diagBg5)" stroke="#374151" stroke-width="2"/>

  <!-- Top Title Banner -->
  <text x="400" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f9fafb" letter-spacing="0.5">
    FAIR SHARING: DIVISION AS EQUAL DISTRIBUTION
  </text>
  <text x="400" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#9ca3af">
    12 divided into 3 equal baskets leaves exactly 4 items in each basket.
  </text>

  <!-- Formula Banner -->
  <g transform="translate(270, 90)">
    <rect x="0" y="0" width="260" height="42" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1.5"/>
    <text x="130" y="27" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#34d399">
      12 ÷ 3 = 4 each
    </text>
  </g>

  <!-- Three Equal Baskets Display -->
  <!-- Basket 1 -->
  <g transform="translate(90, 160)">
    <!-- Basket Outline Card -->
    <rect x="0" y="0" width="180" height="210" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="90" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#60a5fa">
      BASKET 1
    </text>

    <!-- Woven Bowl Graphic -->
    <ellipse cx="90" cy="145" rx="65" ry="32" fill="url(#basketGrad)" stroke="#a16207" stroke-width="2"/>
    <path d="M28,145 Q90,195 152,145" fill="none" stroke="#ca8a04" stroke-width="2" stroke-dasharray="4,3"/>

    <!-- 4 Golden Melons -->
    <circle cx="70" cy="125" r="15" fill="url(#melonGrad)" filter="url(#melonGlow)"/>
    <circle cx="110" cy="125" r="15" fill="url(#melonGrad)" filter="url(#melonGlow)"/>
    <circle cx="60" cy="148" r="15" fill="url(#melonGrad)" filter="url(#melonGlow)"/>
    <circle cx="100" cy="148" r="15" fill="url(#melonGrad)" filter="url(#melonGlow)"/>

    <text x="90" y="195" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f3f4f6">
      4 Melons
    </text>
  </g>

  <!-- Basket 2 -->
  <g transform="translate(310, 160)">
    <rect x="0" y="0" width="180" height="210" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="90" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#60a5fa">
      BASKET 2
    </text>

    <ellipse cx="90" cy="145" rx="65" ry="32" fill="url(#basketGrad)" stroke="#a16207" stroke-width="2"/>
    <path d="M28,145 Q90,195 152,145" fill="none" stroke="#ca8a04" stroke-width="2" stroke-dasharray="4,3"/>

    <circle cx="70" cy="125" r="15" fill="url(#melonGrad)" filter="url(#melonGlow)"/>
    <circle cx="110" cy="125" r="15" fill="url(#melonGrad)" filter="url(#melonGlow)"/>
    <circle cx="60" cy="148" r="15" fill="url(#melonGrad)" filter="url(#melonGlow)"/>
    <circle cx="100" cy="148" r="15" fill="url(#melonGrad)" filter="url(#melonGlow)"/>

    <text x="90" y="195" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f3f4f6">
      4 Melons
    </text>
  </g>

  <!-- Basket 3 -->
  <g transform="translate(530, 160)">
    <rect x="0" y="0" width="180" height="210" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="90" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#60a5fa">
      BASKET 3
    </text>

    <ellipse cx="90" cy="145" rx="65" ry="32" fill="url(#basketGrad)" stroke="#a16207" stroke-width="2"/>
    <path d="M28,145 Q90,195 152,145" fill="none" stroke="#ca8a04" stroke-width="2" stroke-dasharray="4,3"/>

    <circle cx="70" cy="125" r="15" fill="url(#melonGrad)" filter="url(#melonGlow)"/>
    <circle cx="110" cy="125" r="15" fill="url(#melonGrad)" filter="url(#melonGlow)"/>
    <circle cx="60" cy="148" r="15" fill="url(#melonGrad)" filter="url(#melonGlow)"/>
    <circle cx="100" cy="148" r="15" fill="url(#melonGrad)" filter="url(#melonGlow)"/>

    <text x="90" y="195" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f3f4f6">
      4 Melons
    </text>
  </g>

  <!-- Bottom Equitability Caption -->
  <g transform="translate(250, 395)">
    <text x="150" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#10b981">
      ⚖️ Perfect Balance: Zero remaining (12 = 4 + 4 + 4)
    </text>
  </g>
</svg>
