<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" role="img" aria-label="Concrete mathematical diagram comparing series circuits representing logical AND with parallel circuits representing logical OR">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#1c2333"/>
    </linearGradient>
    <filter id="circuitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad6)" stroke="#2b344a" stroke-width="2"/>

  <!-- Blueprint Grid Coordinate Lines -->
  <line x1="50" y1="210" x2="750" y2="210" stroke="#2a3348" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="400" y1="70" x2="400" y2="370" stroke="#2a3348" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Top Title Banner -->
  <text x="400" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="0.5">
    ARISTOTLE'S LOGIC AS PHYSICAL CIRCUITS
  </text>
  <text x="400" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">
    Claude Shannon (1938): Logical conjunction (AND) is series wiring; disjunction (OR) is parallel wiring.
  </text>

  <!-- LEFT PANEL: SERIES CIRCUIT (LOGICAL AND: P ∧ Q) -->
  <g transform="translate(80, 110)">
    <!-- Container -->
    <rect width="300" height="235" rx="12" fill="#032b43" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.8"/>

    <text x="150" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#38bdf8">
      SERIES CIRCUIT · CONJUNCTION (P ∧ Q)
    </text>
    <text x="150" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">
      Both switches must close for current to flow.
    </text>

    <!-- Circuit Loop Schematic -->
    <!-- Power Line Top -->
    <line x1="40" y1="80" x2="70" y2="80" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    <!-- Switch P (Closed) -->
    <circle cx="70" cy="80" r="5" fill="#38bdf8"/>
    <circle cx="110" cy="80" r="5" fill="#38bdf8"/>
    <line x1="70" y1="80" x2="110" y2="80" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <text x="90" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">Switch P: T</text>

    <line x1="110" y1="80" x2="150" y2="80" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    <!-- Switch Q (Closed) -->
    <circle cx="150" cy="80" r="5" fill="#38bdf8"/>
    <circle cx="190" cy="80" r="5" fill="#38bdf8"/>
    <line x1="150" y1="80" x2="190" y2="80" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <text x="170" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">Switch Q: T</text>

    <line x1="190" y1="80" x2="260" y2="80" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <!-- Wire Down to Lamp -->
    <line x1="260" y1="80" x2="260" y2="135" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    <!-- THE GLOWING LAMP (R = True) -->
    <g transform="translate(260, 145)">
      <circle cx="0" cy="0" r="16" fill="#fef08a" stroke="#f59e0b" stroke-width="2" filter="url(#circuitGlow)"/>
      <path d="M-6,-6 L6,6 M-6,6 L6,-6" stroke="#b45309" stroke-width="2"/>
      <text x="0" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#fde68a">LAMP LIT (T)</text>
    </g>

    <!-- Wire Back to Battery -->
    <line x1="260" y1="155" x2="260" y2="205" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="260" y1="205" x2="40" y2="205" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="205" x2="40" y2="155" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    <!-- Battery Source -->
    <g transform="translate(40, 140)">
      <line x1="-12" y1="-8" x2="12" y2="-8" stroke="#f59e0b" stroke-width="3.5"/>
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#94a3b8" stroke-width="2.5"/>
      <line x1="-12" y1="8" x2="12" y2="8" stroke="#f59e0b" stroke-width="3.5"/>
      <line x1="-6" y1="16" x2="6" y2="16" stroke="#94a3b8" stroke-width="2.5"/>
      <text x="-20" y="6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#f59e0b">+</text>
    </g>
    <line x1="40" y1="125" x2="40" y2="80" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- RIGHT PANEL: PARALLEL CIRCUIT (LOGICAL OR: P ∨ Q) -->
  <g transform="translate(420, 110)">
    <!-- Container -->
    <rect width="300" height="235" rx="12" fill="#451a03" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.8"/>

    <text x="150" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#fbbf24">
      PARALLEL CIRCUIT · DISJUNCTION (P ∨ Q)
    </text>
    <text x="150" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">
      Either switch closed allows current to reach the lamp.
    </text>

    <!-- Parallel Branch Wiring -->
    <line x1="40" y1="140" x2="70" y2="140" stroke="#f59e0b" stroke-width="3"/>
    <!-- Split Up and Down -->
    <line x1="70" y1="100" x2="70" y2="180" stroke="#f59e0b" stroke-width="3"/>

    <!-- Top Branch (Switch P: Closed) -->
    <line x1="70" y1="100" x2="95" y2="100" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="95" cy="100" r="5" fill="#f59e0b"/>
    <circle cx="145" cy="100" r="5" fill="#f59e0b"/>
    <line x1="95" y1="100" x2="145" y2="100" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <text x="120" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#34d399">P: True (Closed)</text>
    <line x1="145" y1="100" x2="175" y2="100" stroke="#f59e0b" stroke-width="3"/>

    <!-- Bottom Branch (Switch Q: Open) -->
    <line x1="70" y1="180" x2="95" y2="180" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="95" cy="180" r="5" fill="#f59e0b"/>
    <circle cx="145" cy="180" r="5" fill="#f59e0b"/>
    <!-- Open contact blade angled upward -->
    <line x1="95" y1="180" x2="135" y2="162" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
    <text x="120" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f87171">Q: False (Open)</text>
    <line x1="145" y1="180" x2="175" y2="180" stroke="#f59e0b" stroke-width="3"/>

    <!-- Merge Back -->
    <line x1="175" y1="100" x2="175" y2="180" stroke="#f59e0b" stroke-width="3"/>
    <line x1="175" y1="140" x2="230" y2="140" stroke="#f59e0b" stroke-width="3"/>

    <!-- The Lamp (Still Lit because P provides an unbroken path!) -->
    <g transform="translate(250, 140)">
      <circle cx="0" cy="0" r="16" fill="#fef08a" stroke="#f59e0b" stroke-width="2" filter="url(#circuitGlow)"/>
      <path d="M-6,-6 L6,6 M-6,6 L6,-6" stroke="#b45309" stroke-width="2"/>
      <text x="0" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#fde68a">LAMP LIT (T)</text>
    </g>

    <!-- Return Wire -->
    <line x1="250" y1="156" x2="250" y2="215" stroke="#f59e0b" stroke-width="3"/>
    <line x1="250" y1="215" x2="40" y2="215" stroke="#f59e0b" stroke-width="3"/>
    <line x1="40" y1="215" x2="40" y2="140" stroke="#f59e0b" stroke-width="3"/>
  </g>

  <!-- EQUATION BANNER (Bottom Center) -->
  <g transform="translate(240, 375)">
    <rect width="320" height="48" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="160" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#34d399">
      P ∧ Q ⟹ R   ·   P ∨ Q ⟹ R
    </text>
  </g>
</svg>
