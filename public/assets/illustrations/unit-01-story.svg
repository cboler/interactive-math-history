<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" role="img" aria-label="An ancient artisan carving tally notches into the Ishango bone with a sharp quartz tool at Lake Edward at sunset">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1c38"/>
      <stop offset="35%" stop-color="#4a2545"/>
      <stop offset="65%" stop-color="#99424f"/>
      <stop offset="85%" stop-color="#d96b43"/>
      <stop offset="100%" stop-color="#f5a65b"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff6cf"/>
      <stop offset="50%" stop-color="#f5c26b"/>
      <stop offset="100%" stop-color="#d96b43"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d96b43" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#693043"/>
      <stop offset="70%" stop-color="#2a2240"/>
      <stop offset="100%" stop-color="#141829"/>
    </linearGradient>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#3b2b20"/>
      <stop offset="25%" stop-color="#6d5341"/>
      <stop offset="60%" stop-color="#4a3729"/>
      <stop offset="100%" stop-color="#241a13"/>
    </linearGradient>
    <linearGradient id="quartzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f4ff"/>
      <stop offset="100%" stop-color="#7ec8e3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#skyGrad)"/>

  <!-- Distant Rwenzori Mountain Silhouettes -->
  <path d="M0,270 L70,225 L150,250 L240,210 L330,260 L420,230 L530,265 L650,220 L740,245 L800,225 L800,320 L0,320 Z" fill="#2d1c33" opacity="0.85"/>
  <path d="M0,285 L90,255 L180,275 L310,240 L450,280 L580,245 L690,275 L800,255 L800,330 L0,330 Z" fill="#201529" opacity="0.95"/>

  <!-- Sun setting over Lake Edward -->
  <circle cx="480" cy="245" r="42" fill="url(#sunGrad)" filter="url(#glow)"/>

  <!-- Lake Edward Water Surface -->
  <rect x="0" y="290" width="800" height="160" fill="url(#waterGrad)"/>

  <!-- Sun reflection ripples on the water -->
  <ellipse cx="480" cy="300" rx="45" ry="3" fill="#ffd599" opacity="0.7"/>
  <ellipse cx="480" cy="310" rx="35" ry="2.5" fill="#fca868" opacity="0.6"/>
  <ellipse cx="478" cy="322" rx="55" ry="3" fill="#fca868" opacity="0.5"/>
  <ellipse cx="476" cy="336" rx="40" ry="2" fill="#d96b43" opacity="0.4"/>
  <ellipse cx="474" cy="355" rx="60" ry="2.5" fill="#d96b43" opacity="0.3"/>

  <!-- Distant Ishango Fishing Canoes and Shoreline Reeds -->
  <path d="M120,305 C135,302 165,302 175,305 C165,309 135,309 120,305 Z" fill="#130d1c"/>
  <line x1="145" y1="297" x2="147" y2="310" stroke="#130d1c" stroke-width="2"/>
  <path d="M210,312 C222,310 248,310 258,312 C248,315 222,315 210,312 Z" fill="#130d1c" opacity="0.8"/>

  <!-- Shoreline bank & boulder where artisan is seated -->
  <path d="M0,450 L0,320 Q120,330 250,345 Q400,360 520,380 Q640,405 800,410 L800,450 Z" fill="#16121f"/>
  <path d="M0,450 L0,340 Q100,350 200,365 Q350,385 450,420 Q500,435 550,450 Z" fill="#241b2e"/>

  <!-- The Artisan (Silhouette with warm sunset rim-light) -->
  <!-- Torso & Arms -->
  <path d="M180,450 C185,390 205,340 240,315 C265,298 295,300 310,320 C320,335 325,360 330,410 C300,435 250,448 180,450 Z" fill="#0f0b17"/>
  <!-- Head & Neck looking down at bone -->
  <ellipse cx="275" cy="270" rx="20" ry="24" fill="#0f0b17"/>
  <path d="M260,285 C265,300 285,302 295,295" fill="#0f0b17"/>

  <!-- Left Arm holding the Ishango Bone steady -->
  <path d="M230,340 C245,360 270,385 305,390 C320,392 335,385 345,375" fill="none" stroke="#0f0b17" stroke-width="22" stroke-linecap="round"/>

  <!-- Right Arm carving with the sharp Quartz Crystal -->
  <path d="M310,330 C335,345 365,355 385,350 C395,348 400,345 405,355" fill="none" stroke="#0f0b17" stroke-width="18" stroke-linecap="round"/>

  <!-- THE ISHANGO BONE (Held horizontally across lap/hands) -->
  <g transform="translate(290, 360) rotate(-12)">
    <!-- Bone Shadow -->
    <rect x="-5" y="4" width="170" height="24" rx="10" fill="#000000" opacity="0.5"/>

    <!-- Main Baboon Fibula Shaft -->
    <rect x="0" y="0" width="165" height="20" rx="8" fill="url(#boneGrad)"/>
    <!-- Bone texture / natural curvature highlights -->
    <path d="M5,4 Q80,2 155,5" stroke="#8d6e53" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M10,16 Q80,18 150,15" stroke="#1d140e" stroke-width="2" fill="none" opacity="0.8"/>

    <!-- Quartz crystal mounted at the bone head -->
    <polygon points="160,3 178,8 184,10 176,14 160,17 163,10" fill="url(#quartzGrad)" filter="url(#glow)"/>
    <!-- Binding sinew / resin holding the quartz to bone -->
    <rect x="155" y="1" width="8" height="18" rx="2" fill="#1b120c" stroke="#3d2c20" stroke-width="1"/>

    <!-- Column of Carved Notches (Tally Marks on the Bone) -->
    <!-- First Group of Notches (Group of 3 notches) -->
    <line x1="25" y1="4" x2="25" y2="16" stroke="#fce38a" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="33" y1="5" x2="33" y2="15" stroke="#fce38a" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="41" y1="4" x2="41" y2="16" stroke="#fce38a" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Space between notch clusters -->
    <!-- Second Group of Notches (Group of 2 notches) -->
    <line x1="57" y1="4" x2="57" y2="16" stroke="#68d8d6" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="65" y1="5" x2="65" y2="15" stroke="#68d8d6" stroke-width="2.2" stroke-linecap="round"/>

    <!-- The Fresh Notch currently being cut by the artisan! -->
    <line x1="73" y1="5" x2="73" y2="15" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

    <!-- Subtle future notches along the length -->
    <line x1="90" y1="6" x2="90" y2="14" stroke="#423024" stroke-width="1.5"/>
    <line x1="96" y1="6" x2="96" y2="14" stroke="#423024" stroke-width="1.5"/>
    <line x1="102" y1="6" x2="102" y2="14" stroke="#423024" stroke-width="1.5"/>
    <line x1="108" y1="6" x2="108" y2="14" stroke="#423024" stroke-width="1.5"/>
  </g>

  <!-- Quartz Chiseling Spark / Action Point -->
  <g transform="translate(378, 338)">
    <polygon points="0,0 8,14 -4,16" fill="url(#quartzGrad)"/>
    <circle cx="4" cy="15" r="3" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- Historical Badge / Inscription -->
  <g transform="translate(40, 40)">
    <rect width="260" height="54" rx="8" fill="#14111d" fill-opacity="0.85" stroke="#d96b43" stroke-width="1.5"/>
    <text x="16" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f5a65b" letter-spacing="1">THE ISHANGO BONE · c. 20,000 BCE</text>
    <text x="16" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2d9f3">Carving notches to count and add</text>
  </g>
</svg>
