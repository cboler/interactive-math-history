<a href="#main-content" class="skip-link">Skip to main content</a>

<div class="app-layout">
  <header class="app-header" role="banner">
    <div class="header-inner">
      <div class="brand">
        <a routerLink="/" class="brand-link" id="nav-brand-link">
          <span class="brand-logo" aria-hidden="true">∑</span>
          <span class="brand-title">{{ title() }}</span>
        </a>
      </div>

      <nav class="app-nav" aria-label="Primary Navigation">
        <a
          [routerLink]="[
            '/',
            curriculum.currentLesson().stage || curriculum.currentLesson().level,
            curriculum.currentLesson().slug,
          ]"
          routerLinkActive="active"
          class="nav-link"
          id="nav-link-curriculum"
          (click)="curriculum.toggleDrawer()"
          [attr.aria-expanded]="curriculum.isDrawerOpen()"
          aria-controls="curriculum-drawer"
        >
          {{ curriculum.currentLesson().shortTitle }}
        </a>
        <a
          href="https://github.com/cboler/interactive-math-history"
          target="_blank"
          rel="noopener noreferrer"
          class="nav-link"
          id="nav-link-github"
        >
          GitHub
        </a>
      </nav>

      <div class="header-actions">
        <button
          type="button"
          class="feedback-toggle-btn"
          id="feedback-toggle-btn"
          (click)="feedback.toggleFeedback()"
          [attr.aria-pressed]="feedback.feedbackEnabled()"
          aria-label="Toggle audio and tactile feedback"
        >
          <app-icon [name]="feedback.feedbackEnabled() ? 'volume' : 'volume-x'"></app-icon>
        </button>

        @if (canInstall()) {
          <button
            type="button"
            class="install-btn"
            id="install-pwa-btn"
            (click)="installApp()"
            aria-label="Install App"
          >
            ⬇ Install App
          </button>
        }

        <div
          class="network-badge"
          [class.online]="isOnline()"
          [class.offline]="!isOnline()"
          role="status"
          [attr.aria-label]="
            isOnline() ? 'Application is online' : 'Application is running offline'
          "
        >
          <span class="dot"></span>
          <span class="network-text">{{ isOnline() ? 'Online' : 'Offline' }}</span>
        </div>
      </div>
    </div>
  </header>

  <main id="main-content" class="app-content" role="main">
    <router-outlet />
  </main>

  <footer class="app-footer" role="contentinfo">
    <div class="footer-inner">
      <p class="footer-text">
        Interactive Math &amp; History • An interactive, accessible mathematics &amp; history
        curriculum
      </p>
      <div class="footer-links">
        <a
          href="https://github.com/cboler/interactive-math-history"
          target="_blank"
          rel="noopener noreferrer"
        >
          GitHub Repository
        </a>
      </div>
    </div>
  </footer>
</div>
