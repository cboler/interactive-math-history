<a href="#main-content" class="skip-link">Skip to main content</a>

<div class="app-layout">
  <header class="app-header" role="banner">
    <div class="header-inner">
      <div class="brand">
        <a routerLink="/" class="brand-link" id="nav-brand-link">
          <span class="brand-logo" aria-hidden="true">∑</span>
          <span class="brand-title">{{ title() }}</span>
        </a>
      </div>

      <div class="header-actions">
        <button
          type="button"
          class="theme-toggle-btn"
          id="theme-toggle-btn"
          (click)="toggleTheme()"
          [attr.aria-label]="isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
          [attr.title]="isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
        >
          <app-icon [name]="isDark() ? 'sun' : 'moon'"></app-icon>
        </button>

        <button
          type="button"
          class="feedback-toggle-btn"
          id="feedback-toggle-btn"
          (click)="feedback.toggleFeedback()"
          [attr.aria-pressed]="feedback.feedbackEnabled()"
          aria-label="Toggle audio and tactile feedback"
        >
          <app-icon [name]="feedback.feedbackEnabled() ? 'volume' : 'volume-x'"></app-icon>
        </button>

        @if (canInstall()) {
          <button
            type="button"
            class="install-btn"
            id="install-pwa-btn"
            (click)="installApp()"
            aria-label="Install App"
          >
            ⬇ Install App
          </button>
        }
      </div>
    </div>
  </header>

  <main id="main-content" class="app-content" role="main">
    <router-outlet />
  </main>

  <footer class="app-footer" role="contentinfo">
    <div class="footer-inner">
      <p class="footer-text">
        Interactive Math &amp; History • An interactive, accessible mathematics &amp; history
        curriculum
      </p>
      <div class="footer-links">
        <a
          href="https://github.com/cboler/interactive-math-history"
          target="_blank"
          rel="noopener noreferrer"
        >
          GitHub Repository
        </a>
      </div>
    </div>
  </footer>

  <!-- Floating Back-to-Top Navigation Aid -->
  @if (showBackToTop()) {
    <button
      type="button"
      class="floating-back-to-top-btn"
      id="back-to-top-btn"
      (click)="scrollToTop()"
      aria-label="Back to top"
      title="Back to top"
    >
      <app-icon name="arrow-up"></app-icon>
    </button>
  }
</div>
